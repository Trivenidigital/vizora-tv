apply plugin: 'com.android.application'

// ─── Release signing material ────────────────────────────────────────────────────────────────
//
// Sources, in order of precedence: android/keystore.properties, then the environment.
//
//     keystore.properties      environment
//     ---------------------    ------------------------------
//     storeFile                VIZORA_KEYSTORE_FILE
//     storePassword            VIZORA_KEYSTORE_PASSWORD
//     keyAlias                 VIZORA_KEY_ALIAS
//     keyPassword              VIZORA_KEY_PASSWORD
//
// The environment path exists because rootProject.file("keystore.properties") resolves PER
// WORKTREE. A release build from any clean checkout therefore finds no file, which used to mean
// "build it unsigned" — see the fail-closed note below.
//
// storeFile may be absolute, or relative to android/app (the historical meaning of the
// "../vizora-release.jks" form) or to android/. It is NOT copied anywhere: point at it where it
// already lives.
//
// This block never fails the build. Missing material has to stay non-fatal at configuration
// time or it would break debug builds, unit tests and IDE sync — CI runs testDebugUnitTest with
// no keystore at all. The refusal is scoped to release packaging tasks; see FAIL CLOSED below.

def vizoraSigningProps = new Properties()
def vizoraKeystorePropertiesFile = rootProject.file("keystore.properties")
if (vizoraKeystorePropertiesFile.exists()) {
    vizoraKeystorePropertiesFile.withInputStream { vizoraSigningProps.load(it) }
}

def vizoraSigningValue = { String fileKey, String envKey ->
    def fromFile = vizoraSigningProps.getProperty(fileKey)?.trim()
    if (fromFile) {
        return fromFile
    }
    def fromEnv = System.getenv(envKey)?.trim()
    return fromEnv ?: null
}

def vizoraResolveKeystore = { String path ->
    if (!path) {
        return null
    }
    def asGiven = new File(path)
    if (asGiven.isAbsolute()) {
        return asGiven
    }
    // Relative paths: android/app first (what "../vizora-release.jks" has always meant), then
    // android/. Return the app-relative candidate when neither exists so the error names one
    // concrete place that was looked at rather than a list.
    def candidates = [new File(project.projectDir, path), new File(rootProject.projectDir, path)]
    return candidates.find { it.isFile() } ?: candidates.first()
}

def vizoraStoreFilePath = vizoraSigningValue('storeFile', 'VIZORA_KEYSTORE_FILE')
def vizoraStorePassword = vizoraSigningValue('storePassword', 'VIZORA_KEYSTORE_PASSWORD')
def vizoraKeyAlias = vizoraSigningValue('keyAlias', 'VIZORA_KEY_ALIAS')
def vizoraKeyPassword = vizoraSigningValue('keyPassword', 'VIZORA_KEY_PASSWORD')
def vizoraKeystoreFile = vizoraResolveKeystore(vizoraStoreFilePath)

def vizoraSigningMissing = []
if (!vizoraStoreFilePath) {
    vizoraSigningMissing << "storeFile (or \$VIZORA_KEYSTORE_FILE)"
} else if (!vizoraKeystoreFile.isFile()) {
    vizoraSigningMissing << "the keystore itself - storeFile is '${vizoraStoreFilePath}', which " +
        "does not resolve to a readable file (looked at ${vizoraKeystoreFile.absolutePath})"
}
if (!vizoraStorePassword) {
    vizoraSigningMissing << "storePassword (or \$VIZORA_KEYSTORE_PASSWORD)"
}
if (!vizoraKeyAlias) {
    vizoraSigningMissing << "keyAlias (or \$VIZORA_KEY_ALIAS)"
}
if (!vizoraKeyPassword) {
    vizoraSigningMissing << "keyPassword (or \$VIZORA_KEY_PASSWORD)"
}
def vizoraSigningReady = vizoraSigningMissing.isEmpty()

android {
    namespace "com.vizora.display"
    compileSdk rootProject.ext.compileSdkVersion
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.vizora.display"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10145
        versionName "1.3.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Populated only when every piece resolved — see the resolver above. A partially
            // populated config is worse than none: it fails deep inside the packaging task with
            // a message about the keystore rather than about what the operator forgot to supply.
            if (vizoraSigningReady) {
                storeFile vizoraKeystoreFile
                storePassword vizoraStorePassword
                keyAlias vizoraKeyAlias
                keyPassword vizoraKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Attached only when the material resolved. When it did not, this variant stays
            // unsigned AND the build refuses to package it — the refusal is what makes leaving
            // it unattached safe. See FAIL CLOSED at the end of this file.
            if (vizoraSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Generate APK and AAB with descriptive names.
    //
    // NOTE this rename also erases the "-unsigned" suffix AGP puts on an unsigned release APK,
    // which was the last filename-level tell that a build had silently gone out unsigned. That
    // is only acceptable because a release build can no longer BE unsigned: the FAIL CLOSED
    // check below stops packaging before this rename can run. Do not weaken that check without
    // reinstating a signedness tell here.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def buildType = variant.buildType.name
            outputFileName = "vizora-display-${versionName}-${buildType}.apk"
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Robolectric normally downloads its android-all runtime jar itself, at TEST time, with its
// own HTTP client (MavenArtifactFetcher). Resolve it through Gradle instead and run
// Robolectric in offline mode against the resolved file. Two reasons: the test run becomes
// hermetic (no network during `testDebugUnitTest`, so the suite is reproducible and CI does
// not depend on Maven Central being reachable from the forked test JVM), and the fetcher's
// client does not inherit the Gradle JVM's trust configuration, so on a workstation behind a
// TLS-intercepting proxy its download fails while Gradle's own resolution succeeds.
configurations {
    robolectricAndroidAll
}

dependencies {
    // Pinned to the android-all build that Robolectric 4.14.1 maps to the project's
    // targetSdk (35) — see org.robolectric.plugins.DefaultSdkProvider. Bump this in
    // lockstep with the robolectric version or with targetSdk.
    robolectricAndroidAll "org.robolectric:android-all-instrumented:15-robolectric-12650502-i7"
}

def robolectricJarDir = layout.buildDirectory.dir("robolectric-android-all")

tasks.register('collectRobolectricAndroidAll', Copy) {
    from configurations.robolectricAndroidAll
    into robolectricJarDir
}

tasks.withType(Test).configureEach {
    dependsOn 'collectRobolectricAndroidAll'
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', robolectricJarDir.get().asFile.absolutePath
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ─── FAIL CLOSED: a release artifact is signed, or it does not exist ─────────────────────────
//
// What this replaces: both the signingConfigs block and the release buildType used to be
// wrapped in `if (keystorePropertiesFile.exists())`. With no file — the normal state of any
// clean worktree, since that path resolves per worktree — the release variant silently got no
// signing config at all, AGP emitted app-release-unsigned.apk, and the unconditional rename
// above renamed it to vizora-display-<version>-release.apk. Unsigned bytes under the name we
// ship, with nothing in the build output saying so.
//
// Why the check lives HERE and not at configuration time. A configuration-time throw would be
// simpler and wrong: it would break `./gradlew testDebugUnitTest` (which CI runs with no
// keystore), every debug build, and IDE sync. Signing material is only genuinely required to
// PACKAGE a release, so that is exactly the scope of the refusal — the task graph is inspected
// once it is known, and the build stops before any packaging task runs.
gradle.taskGraph.whenReady { graph ->
    def releasePackagingTasks = graph.allTasks.findAll { task ->
        task.project.path == project.path &&
            task.name ==~ /^(assemble|bundle|package)([A-Z]\w*)?Release$/
    }
    if (releasePackagingTasks.isEmpty()) {
        return
    }

    if (!vizoraSigningReady) {
        throw new GradleException(
            "Refusing to package a release artifact: the signing material is incomplete.\n\n" +
            "  Missing:\n" +
            vizoraSigningMissing.collect { "    - ${it}" }.join("\n") + "\n\n" +
            "  Requested: ${releasePackagingTasks.collect { it.path }.join(', ')}\n\n" +
            "  Supply it either in ${vizoraKeystorePropertiesFile.absolutePath}\n" +
            "  or via VIZORA_KEYSTORE_FILE / VIZORA_KEYSTORE_PASSWORD / VIZORA_KEY_ALIAS /\n" +
            "  VIZORA_KEY_PASSWORD. The keystore does not need to be inside this worktree -\n" +
            "  VIZORA_KEYSTORE_FILE may be an absolute path to wherever it already lives.\n\n" +
            "  This build used to succeed and produce an UNSIGNED apk under the shipping\n" +
            "  filename. An unsigned or wrongly-signed artifact cannot update a paired device:\n" +
            "  it fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE and is only recoverable by\n" +
            "  uninstalling, which un-pairs the fleet.")
    }

    // Belt and braces: material resolving is not the same fact as the config being ATTACHED to
    // the release variant. If a future edit drops the `signingConfig signingConfigs.release`
    // line, everything above still reports "ready" while AGP happily emits unsigned bytes.
    if (android.buildTypes.release.signingConfig == null) {
        throw new GradleException(
            "Refusing to package a release artifact: signing material resolved, but no signing " +
            "config is attached to the release build type. This is a build-script defect, not a " +
            "missing credential - see buildTypes.release in ${buildFile}.")
    }
}
