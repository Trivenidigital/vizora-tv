apply plugin: 'com.android.application'

android {
    namespace "com.vizora.display"
    compileSdk rootProject.ext.compileSdkVersion
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.vizora.display"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10145
        versionName "1.3.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Load signing config from local properties or environment variables
            // Create keystore.properties file with:
            // storeFile=path/to/vizora-release.keystore
            // storePassword=your-store-password
            // keyAlias=vizora-display
            // keyPassword=your-key-password
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use release signing config if available
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Generate APK and AAB with descriptive names
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def buildType = variant.buildType.name
            outputFileName = "vizora-display-${versionName}-${buildType}.apk"
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Robolectric normally downloads its android-all runtime jar itself, at TEST time, with its
// own HTTP client (MavenArtifactFetcher). Resolve it through Gradle instead and run
// Robolectric in offline mode against the resolved file. Two reasons: the test run becomes
// hermetic (no network during `testDebugUnitTest`, so the suite is reproducible and CI does
// not depend on Maven Central being reachable from the forked test JVM), and the fetcher's
// client does not inherit the Gradle JVM's trust configuration, so on a workstation behind a
// TLS-intercepting proxy its download fails while Gradle's own resolution succeeds.
configurations {
    robolectricAndroidAll
}

dependencies {
    // Pinned to the android-all build that Robolectric 4.14.1 maps to the project's
    // targetSdk (35) — see org.robolectric.plugins.DefaultSdkProvider. Bump this in
    // lockstep with the robolectric version or with targetSdk.
    robolectricAndroidAll "org.robolectric:android-all-instrumented:15-robolectric-12650502-i7"
}

def robolectricJarDir = layout.buildDirectory.dir("robolectric-android-all")

tasks.register('collectRobolectricAndroidAll', Copy) {
    from configurations.robolectricAndroidAll
    into robolectricJarDir
}

tasks.withType(Test).configureEach {
    dependsOn 'collectRobolectricAndroidAll'
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', robolectricJarDir.get().asFile.absolutePath
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
