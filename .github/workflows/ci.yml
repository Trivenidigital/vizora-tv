name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  web:
    name: Web (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Version alignment (package.json vs gradle/tizen/webos)
        run: node scripts/check-version-alignment.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      # The TV build is a SHIPPING release target (Tizen/webOS) that had zero CI
      # coverage: the artifact assertions in vite.config.ts run in writeBundle, so the
      # TV size budget was never exercised by anything automated. Both builds run here
      # so a bundle regression fails the PR rather than the release.
      - name: Build (modern) — runs the artifact assertions
        run: npm run build
      - name: Build (TV/legacy) — runs the artifact assertions for Tizen/webOS
        run: npm run build:tv

  android-unit-tests:
    name: Android JVM unit tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      # cap sync generates the capacitor-cordova-android-plugins module
      # (cordova.variables.gradle etc.), which is gitignored — Gradle needs it.
      # cap copy needs dist/, so build the web app first.
      - name: Build web + sync Capacitor Android
        run: |
          npm run build
          npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Run JVM unit tests (F36 RendererRecoveryGuard, etc.)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
